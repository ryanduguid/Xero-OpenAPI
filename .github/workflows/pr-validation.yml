name: PR Validation

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [master]

jobs:
  codegen-validation:
    # Needs the Xero codegen GitHub App, which only the upstream repository holds.
    if: github.repository == 'XeroAPI/Xero-OpenAPI'
    runs-on: ubuntu-latest
    name: Codegen Repo Validation
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get github app access token
        id: get_access_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.XERO_CODEGEN_APP_ID }}
          private-key: ${{ secrets.XERO_GITHUB_APPLICATION_KEY }}
          owner: xero-internal
          repositories: xeroapi-sdk-codegen

      - name: Trigger validation workflow in codegen repo
        id: codegen_workflow
        env:
          GH_TOKEN: ${{ steps.get_access_token.outputs.token }}
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.sha }}"
          OAS_REPO="${{ github.event.pull_request.head.repo.full_name }}"

          # Capture the run created by this dispatch, including under concurrent PRs.
          RUN_URL=$(gh workflow run pr.yml \
            --repo xero-internal/xeroapi-sdk-codegen \
            --ref master \
            --field oas_branch="$BRANCH_NAME" \
            --field oas_repo="$OAS_REPO")
          if [[ "$RUN_URL" =~ https://github.com/xero-internal/xeroapi-sdk-codegen/actions/runs/([0-9]+) ]]; then
            RUN_ID="${BASH_REMATCH[1]}"
          else
            echo "Workflow dispatch did not return a run URL." >&2
            exit 1
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Triggered workflow run ID: $RUN_ID"

      - name: Check status of codegen validation workflow
        uses: Codex-/await-remote-run@a56c556e6434d2d7ec9438dc656143b39532324e # v1.13.0
        with:
          token: ${{ steps.get_access_token.outputs.token }}
          repo: xeroapi-sdk-codegen
          owner: xero-internal
          run_id: ${{ steps.codegen_workflow.outputs.run_id }}
          run_timeout_seconds: 420 # 7 minutes

